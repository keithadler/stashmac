name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Unit suites via XCTest
        run: swift test
      - name: Build universal app
        run: ./build-app.sh
      - name: Suites via the binary
        run: "'build/Stash for Mac.app/Contents/MacOS/StashMac' selftest"
      - name: Integration through the CLI
        run: ./tests/integration.sh
